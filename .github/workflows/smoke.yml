name: Live smoke check

# Verifies the deployed site is up and serving the app. Runs after each Pages
# deploy, on a daily schedule, and on demand — a lightweight uptime monitor.
on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site responds
        run: |
          set -euo pipefail
          URL="https://agntdev.github.io/satellitesnap/"
          echo "Probing $URL"
          code=$(curl -sS -o body.html -w "%{http_code}" "$URL")
          echo "HTTP $code"
          test "$code" = "200"
          grep -qi "satellitesnap" body.html
          echo "✓ live site is up and serving the app"
